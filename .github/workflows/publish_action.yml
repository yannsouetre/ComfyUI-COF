# Publishes the nodes to the Comfy Registry (registry.comfy.org).
# One-time setup: create the publisher "yannsouetre" on registry.comfy.org, create an API key there,
# and store it in this repository: Settings → Secrets and variables → Actions → New repository secret
# named REGISTRY_ACCESS_TOKEN. Then run this workflow by hand (Actions → Publish to Comfy registry → Run workflow)
# after each version bump in pyproject.toml.
name: Publish to Comfy registry
on:
  workflow_dispatch:
jobs:
  publish-node:
    name: Publish custom node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'yannsouetre' }}
    steps:
      - uses: actions/checkout@v4
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
